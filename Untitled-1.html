<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #234b85;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        h2 {
            color: #234b85;
            font-size: 20px;
            margin: 25px 0 15px;
            border-bottom: 2px solid #234b85;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #234b85;
        }

        textarea {
            resize: vertical;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #234b85;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        button:hover {
            background: #16345f;
        }

        .reset {
            background: #777;
        }

        .reset:hover {
            background: #555;
        }

        /* Mobile Responsive Design */

        @media screen and (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 23px;
            }

            h2 {
                font-size: 18px;
            }

            input, select, textarea {
                font-size: 14px;
                padding: 11px;
            }

            button {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Admission Form</h1>
        <p class="subtitle">Please fill in your details below</p>

        <form>

            <h2>Personal Information</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter your address" rows="3"></textarea>
            </div>

            <h2>Academic Information</h2>

            <div class="form-group">
                <label>Previous School / College</label>
                <input type="text" placeholder="Enter previous institution">
            </div>

            <div class="form-group">
                <label>Previous Qualification</label>
                <select>
                    <option value="">Select Qualification</option>
                    <option>10th</option>
                    <option>Intermediate</option>
                    <option>Diploma</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course Applying For</label>
                <select required>
                    <option value="">Select Course</option>
                    <option>B.Tech CSE</option>
                    <option>B.Tech ECE</option>
                    <option>B.Tech EEE</option>
                    <option>BBA</option>
                    <option>BCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Percentage / CGPA</label>
                <input type="text" placeholder="Enter your marks">
            </div>

            <h2>Parent / Guardian Information</h2>

            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" placeholder="Enter parent name">
            </div>

            <div class="form-group">
                <label>Parent Phone Number</label>
                <input type="tel" placeholder="Enter parent phone">
            </div>

            <div class="form-group">
                <label>Upload Photo</label>
                <input type="file" accept="image/*">
            </div>

            <div class="terms">
                <input type="checkbox" required>
                <label>I confirm that the above information is correct.</label>
            </div>

            <button type="submit">Submit Application</button>

            <button type="reset" class="reset">Reset Form</button>

        </form>

    </div>

</body>
</html>
